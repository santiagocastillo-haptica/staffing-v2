<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Horas · Háptica</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .changes-badge {
      font-size: 12px; font-weight: 600; color: #92400e;
      background: #fef3c7; border: 1px solid #fde68a;
      padding: 4px 10px; border-radius: 99px; display: none;
    }
    .legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #6b7280; }
    .legend .dot { width: 10px; height: 10px; border-radius: 3px; background: #fee2e2; border: 1.5px solid #dc2626; display: inline-block; }

    /* ── Matrix (mismo look de Editar Presupuesto) ─────────── */
    .matrix-wrap { overflow-x: auto; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
    .matrix { border-collapse: collapse; font-size: 12px; background: #fff; min-width: 100%; }
    .matrix .col-name {
      position: sticky; left: 0; z-index: 2;
      background: #fff; min-width: 180px; max-width: 200px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .matrix thead .col-name { background: #1a2e35; z-index: 3; }
    .matrix .col-desv { position: sticky; right: 0; z-index: 2; background: #fff; min-width: 110px; }
    .matrix thead .col-desv { background: #1a2e35; z-index: 3; }

    .matrix thead tr th { padding: 0; text-align: center; font-weight: 600; white-space: nowrap; }
    .row-month th {
      background: #1a2e35; color: rgba(255,255,255,0.7);
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; padding: 7px 4px; border-right: 1px solid #2d4350;
    }
    .row-month th.col-name, .row-month th.col-desv { color: rgba(255,255,255,0.4); font-size: 10px; }
    .row-dates th {
      background: #243b44; color: rgba(255,255,255,0.5);
      font-size: 10px; font-weight: 500; padding: 4px 4px; border-right: 1px solid #2d4350;
    }
    .row-weeks th {
      background: #1a2e35; color: #fff;
      font-size: 13px; font-weight: 800; padding: 6px 4px;
      border-right: 1px solid #2d4350; min-width: 52px;
    }

    .row-project td {
      background: #fff; padding: 2px 4px;
      border-bottom: 1px solid #f0f4f5; border-right: 1px solid #f0f4f5; text-align: center;
    }
    .row-project td.col-name {
      text-align: left; padding-left: 12px; font-size: 12px;
      color: #374151; font-weight: 600; border-right: 2px solid #003237;
    }
    .row-project td.col-desv { border-left: 2px solid #003237; }
    .row-project:hover td { background: #f8fbfc; }
    .row-project:hover td.col-name, .row-project:hover td.col-desv { background: #f8fbfc; }
    .row-add td { background: #fff; padding: 4px; border-bottom: 2px solid #eef2f4; }
    .btn-add-row {
      background: none; border: none; cursor: pointer;
      color: #9ca3af; font-size: 11px; font-weight: 500;
      padding: 4px 12px; font-family: inherit; transition: color 0.15s;
    }
    .btn-add-row:hover { color: #003237; }

    .hrs-input {
      width: 44px; padding: 4px 2px; border: 1.5px solid transparent;
      border-radius: 5px; font-family: inherit; font-size: 12px; font-weight: 600;
      color: #1a2e35; text-align: center; background: transparent; transition: all 0.12s;
    }
    .hrs-input:hover { border-color: #d4dfe2; background: #fff; }
    .hrs-input:focus { outline: none; border-color: #003237; background: #fff; }
    .hrs-input.changed { border-color: #f59e0b; background: #fffbeb; color: #92400e; }
    .hrs-input.missing { border-color: #dc2626; background: #fee2e2; }
    .hrs-input::-webkit-inner-spin-button, .hrs-input::-webkit-outer-spin-button { opacity: 0.4; }

    .pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .pill-ok       { background: #d1fae5; color: #065f46; }
    .pill-warning  { background: #fef3c7; color: #92400e; }
    .pill-exceeded { background: #fee2e2; color: #991b1b; }
    .pill-critical { background: #991b1b; color: #fff; }

    .saving-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,50,55,0.7); z-index: 200;
      align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    }
    .saving-overlay.open { display: flex; }
    .saving-overlay .spinner {
      width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .saving-overlay p { color: #fff; font-size: 14px; font-weight: 600; }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 14px; padding: 26px 30px;
      width: 380px; max-width: 95vw; box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }
    .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 18px; }
    .modal-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .modal-field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #5a7a82; }
    .modal-field input {
      padding: 8px 11px; border: 1.5px solid #d4dfe2; border-radius: 7px;
      font-family: inherit; font-size: 13px; font-weight: 500; color: #1a2e35; background: #fff;
    }
    .modal-field input:focus { outline: none; border-color: #003237; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Registro de Horas</h1>
    <div class="subtitle">Reporta tus horas ejecutadas por proyecto y semana</div>
  </div>
  <div class="header-right" id="navContainer"></div>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-screen">
    <div class="login-card">
      <h2>Acceso restringido</h2>
      <p>Inicia sesión con tu correo @haptica.co para registrar tus horas.</p>
      <button class="btn-google" id="btnLogin">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Iniciar sesión con Google
      </button>
      <div class="access-denied" id="accessDenied"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="content">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="update-notice" id="updateNotice">Cargando datos…</div>
        <span class="changes-badge" id="changesBadge"></span>
        <span class="legend"><span class="dot"></span> Semana pasada sin reportar</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-secondary" id="btnDiscard" onclick="discardChanges()" style="display:none">Descartar</button>
        <button class="btn-primary" id="btnSave" onclick="saveChanges()" disabled>💾 Guardar cambios</button>
      </div>
    </div>
    <div id="matrixContainer">
      <div class="state-msg"><div class="spinner"></div>Cargando…</div>
    </div>
  </div>
</div>

<!-- Modal nuevo proyecto -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Agregar proyecto</h3>
    <div class="modal-field">
      <label>Proyecto</label>
      <input type="text" id="modalProyecto" placeholder="Ej: TELMEX-02" autocomplete="off" />
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="confirmNewRow()">Agregar</button>
    </div>
  </div>
</div>

<div class="saving-overlay" id="savingOverlay"><div class="spinner"></div><p>Guardando…</p></div>
<div class="toast" id="toast"></div>

<script src="shared/staffing-utils.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script>
let mySession   = null;
let myPersona   = '';
let sheetRows   = [];
let headers     = [];
let colIdx      = {};
let hasAnioCol  = false;
// proyectoData[proyecto][semanaAnioKey] = { presup, ejec, rowIndex }
let proyectoData = {};
let dirtyMatrix  = {}; // proyectoData[proyecto][key] = { hours, rowIndex, isNew, semana, año }
let weekRange    = [];

async function loadData() {
  document.getElementById('matrixContainer').innerHTML =
    '<div class="state-msg"><div class="spinner"></div>Cargando datos…</div>';
  try {
    const res = await gapi.client.sheets.spreadsheets.values.get({
      spreadsheetId: HapticaAuth.SPREADSHEET_ID, range: SHEET_DATA
    });
    const rows = res.result.values || [];
    if (!rows.length) throw new Error('Sheet vacío');
    headers = rows[0].map(h => h.trim().toLowerCase());
    colIdx = {};
    headers.forEach((h, i) => { colIdx[h] = i; });
    hasAnioCol = colIdx['año'] !== undefined;

    sheetRows = rows.slice(1).map((r, i) => {
      const obj = { _row: i + 2 };
      headers.forEach((h, j) => { obj[h] = r[j] ?? ''; });
      obj.colaborador = normalizaColaborador(obj.colaborador);
      obj.semana = Number(obj.semana) || null;
      obj.año = Number(obj.año) || (obj.semana ? inferAnioLegacy(obj.semana) : null);
      obj.horaspresupuestadas = Number(obj.horaspresupuestadas) || 0;
      obj.horasejecutadas = Number(obj.horasejecutadas) || 0;
      return obj;
    }).filter(r => r.semana && r.colaborador);

    buildProyectoData();
    buildWeekRange();
    dirtyMatrix = {};
    renderMatrix();
    updateTimestamp();
  } catch (err) {
    console.error(err);
    document.getElementById('matrixContainer').innerHTML =
      `<div class="state-msg">⚠️ Error al cargar datos.<br><small>${err.message}</small></div>`;
  }
}

function buildProyectoData() {
  proyectoData = {};
  sheetRows.filter(r => r.colaborador === myPersona).forEach(r => {
    const proy = r.proyecto || '—';
    const key = semanaAnioKey(r.semana, r.año);
    if (!proyectoData[proy]) proyectoData[proy] = {};
    proyectoData[proy][key] = { presup: r.horaspresupuestadas, ejec: r.horasejecutadas, rowIndex: r._row };
  });
}

function buildWeekRange() {
  weekRange = getFullWeekRange();
}

function cfgKeyFor(w) { return w.key; } // no depende de Config_Cargabilidad aquí

function calcDesviacionPill(presup, ejec) {
  if (!presup) return { label: '—', cls: 'pill-warning' };
  const ratio = ejec / presup;
  if (ratio > 1.2) return { label: 'Crítico', cls: 'pill-critical' };
  if (ratio > 1.0) return { label: 'Excedido', cls: 'pill-exceeded' };
  if (ratio >= 0.8) return { label: 'Revisar', cls: 'pill-warning' };
  return { label: 'En presupuesto', cls: 'pill-ok' };
}

function effectiveCell(proy, key) {
  const dirty = dirtyMatrix[proy] && dirtyMatrix[proy][key];
  const persisted = proyectoData[proy] && proyectoData[proy][key];
  return {
    presup: persisted ? persisted.presup : 0,
    ejec: dirty ? dirty.hours : (persisted ? persisted.ejec : 0),
    rowIndex: persisted ? persisted.rowIndex : null,
  };
}

// ── Render matrix ─────────────────────────────────────────────────────────
function renderMatrix() {
  updateDirtyUI();

  const monthGroups = [];
  weekRange.forEach(w => {
    const { month, year } = weekMonthYear(w.semana, w.año);
    const gkey = `${year}-${month}`;
    if (!monthGroups.length || monthGroups[monthGroups.length - 1].gkey !== gkey) {
      monthGroups.push({ gkey, label: MONTHS_ES[month], count: 1 });
    } else {
      monthGroups[monthGroups.length - 1].count++;
    }
  });

  const cur = getCurrentIsoYearWeek();
  const curMonday = getWeekMonday(cur.semana, cur.año).getTime();
  const isCurWeek = w => w.semana === cur.semana && w.año === cur.año;

  let thead = '<thead>';
  thead += '<tr class="row-month"><th class="col-name"></th>';
  monthGroups.forEach(g => { thead += `<th colspan="${g.count}">${g.label}</th>`; });
  thead += '<th class="col-desv"></th></tr>';

  thead += '<tr class="row-dates"><th class="col-name"></th>';
  weekRange.forEach(w => { thead += `<th>${weekDateLabel(w.semana, w.año)}</th>`; });
  thead += '<th class="col-desv"></th></tr>';

  thead += '<tr class="row-weeks"><th class="col-name"></th>';
  weekRange.forEach(w => {
    thead += `<th style="${isCurWeek(w) ? 'background:#FA4616;color:#fff' : ''}">${w.semana}<br><span style="font-size:9px;font-weight:600;opacity:.7">${w.año}</span></th>`;
  });
  thead += '<th class="col-desv">Desviación</th></tr>';
  thead += '</thead>';

  const proyectos = sortProjects(Object.keys(proyectoData));
  let tbody = '<tbody>';

  if (!proyectos.length) {
    tbody += `<tr><td class="col-name" colspan="${weekRange.length + 2}" style="text-align:center;color:#9ca3af;padding:20px">Todavía no tienes proyectos asignados.</td></tr>`;
  }

  proyectos.forEach(proy => {
    tbody += `<tr class="row-project" data-proy="${escAttr(proy)}">`;
    tbody += `<td class="col-name">${proy}</td>`;
    let totalPresup = 0, totalEjec = 0;
    weekRange.forEach(w => {
      const cell = effectiveCell(proy, w.key);
      totalPresup += cell.presup;
      totalEjec += cell.ejec;
      const dirty = dirtyMatrix[proy] && dirtyMatrix[proy][w.key] !== undefined;
      const isPast = w.monday < curMonday;
      const missing = isPast && cell.presup > 0 && cell.ejec === 0;
      const cls = ['hrs-input', dirty ? 'changed' : '', missing ? 'missing' : ''].filter(Boolean).join(' ');
      tbody += `<td style="${isCurWeek(w) ? 'background:#fffaf8' : ''}">
        <input class="${cls}" type="number" min="0" step="0.5"
          value="${cell.ejec || ''}" placeholder=""
          data-proy="${escAttr(proy)}" data-week="${w.key}" data-semana="${w.semana}" data-anio="${w.año}"
          data-rowindex="${cell.rowIndex || ''}"
          onchange="onCellChange(this)" />
      </td>`;
    });
    const pill = calcDesviacionPill(totalPresup, totalEjec);
    tbody += `<td class="col-desv" id="desv-${escAttr(proy)}"><span class="pill ${pill.cls}">${pill.label}</span></td>`;
    tbody += '</tr>';
  });

  tbody += `<tr class="row-add">
    <td class="col-name"><button class="btn-add-row" onclick="openModal()">＋ agregar proyecto</button></td>
    ${weekRange.map(() => '<td></td>').join('')}
    <td class="col-desv"></td>
  </tr>`;

  tbody += '</tbody>';

  document.getElementById('matrixContainer').innerHTML =
    `<div class="matrix-wrap"><table class="matrix">${thead}${tbody}</table></div>`;
}

// ── Cell change ───────────────────────────────────────────────────────────
function onCellChange(input) {
  const proy   = input.dataset.proy;
  const key    = input.dataset.week;
  const semana = Number(input.dataset.semana);
  const año    = Number(input.dataset.anio);
  const rowI   = input.dataset.rowindex ? Number(input.dataset.rowindex) : null;
  const newV   = Number(input.value) || 0;
  const orig   = (proyectoData[proy] && proyectoData[proy][key]) ? proyectoData[proy][key].ejec : 0;

  if (!dirtyMatrix[proy]) dirtyMatrix[proy] = {};

  if (newV === orig) {
    delete dirtyMatrix[proy][key];
    input.classList.remove('changed');
  } else {
    dirtyMatrix[proy][key] = { hours: newV, rowIndex: rowI, isNew: !rowI, semana, año };
    input.classList.add('changed');
  }
  input.classList.toggle('missing', false); // ya tiene un valor tecleado, se resuelve la alerta visual al instante
  if (newV === 0) {
    // si vuelve a quedar en 0 y la semana ya pasó con horas presupuestadas, se vuelve a marcar
    const cur = getCurrentIsoYearWeek();
    const curMonday = getWeekMonday(cur.semana, cur.año).getTime();
    const w = weekRange.find(w => w.key === key);
    const cell = effectiveCell(proy, key);
    if (w && w.monday < curMonday && cell.presup > 0) input.classList.add('missing');
  }

  refreshDesviacion(proy);
  updateDirtyUI();
}

function refreshDesviacion(proy) {
  let totalPresup = 0, totalEjec = 0;
  weekRange.forEach(w => {
    const cell = effectiveCell(proy, w.key);
    totalPresup += cell.presup;
    totalEjec += cell.ejec;
  });
  const pill = calcDesviacionPill(totalPresup, totalEjec);
  const el = document.getElementById(`desv-${proy}`);
  if (el) el.innerHTML = `<span class="pill ${pill.cls}">${pill.label}</span>`;
}

function updateDirtyUI() {
  let count = 0;
  Object.values(dirtyMatrix).forEach(w => count += Object.keys(w).length);
  const badge = document.getElementById('changesBadge');
  badge.textContent = `${count} cambio${count !== 1 ? 's' : ''} sin guardar`;
  badge.style.display = count > 0 ? 'inline-block' : 'none';
  document.getElementById('btnSave').disabled = count === 0;
  document.getElementById('btnDiscard').style.display = count > 0 ? 'inline-flex' : 'none';
}

function discardChanges() {
  dirtyMatrix = {};
  renderMatrix();
}

// ── Save ──────────────────────────────────────────────────────────────────
async function saveChanges() {
  const updateData = [];
  const newRows    = [];
  const now        = new Date().toISOString();
  const ejecCol    = colIdx['horasejecutadas'];
  const tsColI     = Object.keys(colIdx).findIndex(k => k.includes('actualizacion') || k.includes('update'));

  Object.entries(dirtyMatrix).forEach(([proy, weekMap]) => {
    Object.entries(weekMap).forEach(([key, cell]) => {
      if (cell.isNew || !cell.rowIndex) {
        newRows.push({ semana: cell.semana, año: cell.año, proyecto: proy, horas: cell.hours });
      } else {
        updateData.push({ range: `${SHEET_DATA}!${colToLetter(ejecCol)}${cell.rowIndex}`, values: [[cell.hours]] });
        if (tsColI >= 0) updateData.push({ range: `${SHEET_DATA}!${colToLetter(tsColI)}${cell.rowIndex}`, values: [[now]] });
      }
    });
  });

  document.getElementById('savingOverlay').classList.add('open');
  try {
    if (updateData.length) {
      await gapi.client.sheets.spreadsheets.values.batchUpdate({
        spreadsheetId: HapticaAuth.SPREADSHEET_ID,
        resource: { valueInputOption: 'RAW', data: updateData },
      });
    }
    if (newRows.length) {
      const appendData = newRows.map(r => {
        const row = new Array(headers.length).fill('');
        row[colIdx['semana']] = r.semana;
        if (hasAnioCol) row[colIdx['año']] = r.año;
        row[colIdx['colaborador']] = myPersona;
        row[colIdx['proyecto']] = r.proyecto;
        row[ejecCol] = r.horas;
        if (tsColI >= 0) row[tsColI] = now;
        return row;
      });
      await gapi.client.sheets.spreadsheets.values.append({
        spreadsheetId: HapticaAuth.SPREADSHEET_ID, range: `${SHEET_DATA}!A1`,
        valueInputOption: 'RAW', insertDataOption: 'INSERT_ROWS',
        resource: { values: appendData },
      });
    }
    document.getElementById('savingOverlay').classList.remove('open');
    showToast('✓ Guardado correctamente', 'success');
    await loadData();
  } catch (err) {
    console.error(err);
    document.getElementById('savingOverlay').classList.remove('open');
    showToast('⚠️ Error al guardar: ' + err.message, 'error');
  }
}

// ── Modal nuevo proyecto ─────────────────────────────────────────────────
function openModal() {
  document.getElementById('modalProyecto').value = '';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function confirmNewRow() {
  const proy = document.getElementById('modalProyecto').value.trim();
  if (!proy) { alert('Ingresa un nombre de proyecto.'); return; }
  if (proyectoData[proy]) { alert(`Ya tienes el proyecto ${proy}.`); return; }
  proyectoData[proy] = {};
  closeModal();
  renderMatrix();
}

// ── Timestamp ─────────────────────────────────────────────────────────────
function updateTimestamp() {
  const tsKey = Object.keys(colIdx).find(k => k.includes('actualizacion') || k.includes('update'));
  let d = null;
  if (tsKey) {
    const dates = sheetRows.filter(r => r.colaborador === myPersona).map(r => r[tsKey]).filter(Boolean);
    if (dates.length) {
      const latest = dates.reduce((a, b) => a > b ? a : b);
      const p = new Date(latest);
      if (!isNaN(p) && p.getFullYear() >= 2020) d = p;
    }
  }
  if (!d) d = new Date();
  document.getElementById('updateNotice').textContent =
    `Datos al ${d.toLocaleString('es-CL', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}`;
}

function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast show ${type}`;
  setTimeout(() => { el.className = 'toast'; }, 3500);
}

    mySession = session;
    myPersona = session.persona;

  }
});
